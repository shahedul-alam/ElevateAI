services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elevateai
    ports:
      - '5433:5432' # 5433 on the host so it does not clash with a native Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
