services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elevateai
    ports:
      - '5433:5432' # 5433 on the host so it does not clash with a native Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis: # BullMQ queues and shared rate limits: REDIS_URL=redis://localhost:6379/0
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'

  mailpit: # local SMTP catcher: SMTP_URL=smtp://localhost:1025, inbox at http://localhost:8025
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
