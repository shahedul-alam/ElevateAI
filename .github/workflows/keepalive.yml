name: Keep Render awake

# Render free web services sleep after ~15 min idle. A ping every 10 min keeps the server (and its
# notification prune timer and summary worker) running. Scheduled runs are best effort and GitHub
# pauses them after 60 days without repo activity. Remove this file if you move to a paid plan.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://elevateai-server.onrender.com/api/health
