services:
  - type: web
    name: elevateai-server
    runtime: docker
    plan: free
    region: singapore # must match the Key Value region (internal Redis URL) and Neon (ap-southeast-1)
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '2' # Vercel + Render; check the 6th bad login answers 429
      - key: REQUIRE_EMAIL_VERIFICATION # 'true' once SMTP_URL works (Render free blocks 25/465/587: use Brevo port 2525)
        sync: false
      - key: AI_ENABLED # 'true' together with OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID # both or neither; client needs VITE_GOOGLE_AUTH=true on Vercel
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL # Neon pooled URL
        sync: false
      - key: REDIS_URL # Render Key Value internal URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL # https://<project>.vercel.app
        sync: false
      - key: CLIENT_ORIGIN # same value as BETTER_AUTH_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
