name: elevateai-prod # separate project so it never touches the dev db/redis containers and volumes
# Production-like stack: docker compose -f docker-compose.prod.yml up -d --build
# First run: docker compose -f docker-compose.prod.yml run --rm server bun run db:deploy
#            docker compose -f docker-compose.prod.yml run --rm server bun run db:seed-catalog
services:
  web:
    build: { context: ., dockerfile: Dockerfile.web }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports: ['80:80', '443:443']
    volumes: [caddy_data:/data]
    depends_on: [server]

  server:
    build: { context: ., dockerfile: server/Dockerfile }
    restart: unless-stopped
    env_file: server/.env.production
    environment:
      TRUST_PROXY: '1' # exactly one hop: Caddy
    depends_on: [db, redis]
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: elevateai
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
